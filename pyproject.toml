[project]
name = "interviewer"
version = "0.1.0"
description = "AI 模拟面试系统 - 桌面端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6==6.8.1.1",
    "qasync==0.27.1",
    "sqlalchemy[asyncio]==2.0.36",
    "aiosqlite==0.20.0",
    "websockets==13.1",
    "httpx==0.28.1",
    "sounddevice==0.5.1",
    "numpy==2.2.1",
    "pydantic==2.10.5",
    "keyring==25.6.0",
    "pdfplumber==0.11.5",
    "python-docx==1.1.2",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
]

[project.scripts]
interviewer = "interviewer.main:main"
interviewer-backend = "interviewer.backend:main"

[project.gui-scripts]
interviewer-app = "interviewer.main:main"

[dependency-groups]
dev = [
    "pyinstaller==6.11.1",
    "ruff==0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interviewer"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 自然语言文案强制折行会破坏可读性
"src/interviewer/llm/prompts.py" = ["E501"]
"src/interviewer/domain/persona.py" = ["E501"]
